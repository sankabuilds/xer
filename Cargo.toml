[package]
name = "xxer"
version = "0.4.0-alpha.1"
edition = "2024"
description = "Xer - Download social media bookmarks"
keywords = ["cli", "x", "twitter", "downloader", "instagram"]
license = "MIT"
repository = "https://github.com/sankabuilds/xer"
readme = ".github/README.md"

[[bin]]
name = "xer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
colored = "3.1.1"
env_logger = "0.11.11"
indicatif = "0.18.6"
little_exif = "0.6.23"
log = "0.4.33"
mp4ameta = "0.13.0"
reqwest = { version = "0.13", features = ["json", "cookies", "query"] }
serde = {version = "1.0.228", features = ["serde_derive"]}
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1", features = ["full"] }

