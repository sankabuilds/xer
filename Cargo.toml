[package]
name = "xxer"
version = "0.5.0-alpha-1"
edition = "2024"
description = "Xer - Download social media bookmarks"
keywords = ["cli", "x", "twitter", "downloader", "instagram"]
license = "MIT"
repository = "https://github.com/sankabuilds/xer"
readme = ".github/README.md"

[[bin]]
name = "xer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.45"
clap = { version = "4.6.2", features = ["derive"] }
colored = "3.1.1"
const_format = "0.2.36"
env_logger = "0.11.11"
ffmpeg-cli = "0.1.0"
indicatif = "0.18.6"
little_exif = "0.6.23"
m3u8-rs = "6.0.1"
mp4ameta = "0.13.0"
regex = "1.13.1"
reqwest = { version = "0.13", features = ["json", "cookies", "query"] }
scraper = "0.27.0"
serde = {version = "1.0.228", features = ["serde_derive"]}
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
